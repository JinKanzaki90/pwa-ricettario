# Pubblica la cartella app/ su GitHub Pages a ogni push su main che la tocca.
name: Pubblica l'app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pubblica.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

  controlla:
    needs: pubblica
    runs-on: ubuntu-latest
    steps:
      - name: Sito raggiungibile e file principali presenti
        env:
          BASE: https://jinkanzaki90.github.io/pwa-ricettario/
        run: |
          sleep 20
          errori=0
          for f in "" css/stile.css js/main.js config.js data/ricette.json data/stagioni.json vendor/supabase-js-2.117.3.esm.js fonts/atkinson-hyperlegible-latin-400-normal.woff2; do
            codice=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors "$BASE$f")
            echo "$codice $BASE$f"
            test "$codice" = "200" || errori=1
          done
          curl -sS "$BASE" | grep -q '<title>Ricettario di famiglia</title>' || { echo "::error::La pagina pubblicata non è quella attesa"; errori=1; }
          exit $errori
