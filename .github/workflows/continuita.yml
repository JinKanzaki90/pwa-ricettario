# Continuità: una chiamata al giorno a Supabase, così il progetto del piano gratuito non viene sospeso
# per inattività. Il backup settimanale arriverà solo cifrato (serve il segreto BACKUP_PASSPHRASE):
# il repository è pubblico e gli artefatti dei workflow sono scaricabili.
name: Continuità

on:
  schedule:
    - cron: '17 4 * * *'   # ogni giorno alle 4:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sveglia:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wtwmjwpmovttalkxzhvm
      SUPABASE_URL: https://wtwmjwpmovttalkxzhvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_i-yE0f6HfcZhjn3wUAf1rQ_GFJkaqCe
    steps:
      - name: Controllo dei segreti
        run: |
          manca=0
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Manca il segreto SUPABASE_ACCESS_TOKEN"; manca=1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Manca il segreto SUPABASE_DB_PASSWORD"; manca=1; }
          exit $manca

      - uses: actions/checkout@v4

      - name: Servizio di accesso raggiungibile
        run: |
          codice=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health")
          echo "Risposta del servizio di accesso: $codice"
          test "$codice" = "200" || { echo "::error::Il servizio di accesso di Supabase non risponde (codice $codice): il progetto potrebbe essere sospeso."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Interrogazione del database
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --password "$SUPABASE_DB_PASSWORD"
